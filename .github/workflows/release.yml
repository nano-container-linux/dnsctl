name: Release (multi-runner artifacts via Taskfile)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true

jobs:
  build:
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - name: linux-amd64
            runs_on: ubuntu-latest
            os: linux
            arch: amd64
          - name: linux-arm64
            runs_on: ubuntu-latest
            os: linux
            arch: arm64
          - name: windows-amd64
            runs_on: windows-latest
            os: windows
            arch: amd64
          - name: macos-arm64
            runs_on: macos-latest
            os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
      - name: Build (native)
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          GOOS=$(go env GOOS)
          GOARCH=$(go env GOARCH)
          echo "Runner reports $GOOS/$GOARCH"
          if [ "$GOOS" != "${{ matrix.os }}" ] || [ "$GOARCH" != "${{ matrix.arch }}" ]; then
            echo "Runner OS/ARCH mismatch: expected ${{ matrix.os }}/${{ matrix.arch }} but got $GOOS/$GOARCH"
            exit 1
          fi
          mkdir -p out
          echo "Building dnsctl for $GOOS/$GOARCH"
          go build -o out/dnsctl-${{ matrix.os }}-${{ matrix.arch }} .
      - name: Upload built binary
        uses: actions/upload-artifact@v4
        with:
          name: dnsctl-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/dnsctl-${{ matrix.os }}-${{ matrix.arch }}*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag }}
          release_name: Release ${{ github.event.inputs.tag }}
          draft: false
          prerelease: false
      - name: Upload assets to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
