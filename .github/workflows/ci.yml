name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint
        run: go vet ./...
      - name: Test
        run: go test ./...

  build-matrix:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: ""
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: ""
          # darwin/amd64 removed: macOS hosted runner macos-13 not available for this org
          - goos: darwin
            goarch: arm64
            runner: macos-14
            ext: ""
          - goos: windows
            goarch: amd64
            runner: windows-latest
            ext: .exe
          - goos: windows
            goarch: arm64
            runner: windows-11-arm
            ext: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          out="dist/dnsctl-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -ldflags='-s -w' -o "$out" .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnsctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/dnsctl-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  build-summary:
    name: Build Summary
    if: ${{ always() }}
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Validate matrix result
        run: |
          test "${{ needs.build-matrix.result }}" = "success"
