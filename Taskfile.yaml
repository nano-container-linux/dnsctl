version: '3'

tasks:
  default:
    desc: Liste les tâches disponibles
    silent: true
    cmds:
      - task --list

  # Generic build: runs natively on the runner matching the TARGET_OS/TARGET_ARCH
  build:
    desc: Build for the given TARGET_OS/TARGET_ARCH (native only)
    vars:
      target_os: "${TARGET_OS}"
      target_arch: "${TARGET_ARCH}"
    cmds:
      - test "$(go env GOOS)" = "{{.target_os}}" || (echo "Runner GOOS $(go env GOOS) != TARGET_OS {{.target_os}}" && exit 1)
      - test "$(go env GOARCH)" = "{{.target_arch}}" || (echo "Runner GOARCH $(go env GOARCH) != TARGET_ARCH {{.target_arch}}" && exit 1)
      - rm -f bin/dnsctl-{{.target_os}}-{{.target_arch}}* || true
      - mkdir -p bin
      - pkgx go build -o bin/dnsctl-{{.target_os}}-{{.target_arch}} .

  # per-OS/ARCH specific build tasks removed; use 'task build TARGET_OS=... TARGET_ARCH=...'

  # Note: 'build:target' removed; use 'task build TARGET_OS=<os> TARGET_ARCH=<arch>'

  test:
    desc: Exécute les tests
    cmds:
      - pkgx go test ./...

  lint:
    desc: Lance le lint Go (vet)
    cmds:
      - pkgx go vet ./...

  run:
    desc: Lance dnsctl
    cmds:
      - pkgx go run . --help

  tidy:
    desc: Synchronise go.mod/go.sum
    cmds:
      - pkgx go mod tidy
